apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Theophilus18-cyber/Prod-Elastic-Kubernetes-Service-GitOPs-Microservice-deployment'
    targetRevision: main
    path: k8s/observability
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

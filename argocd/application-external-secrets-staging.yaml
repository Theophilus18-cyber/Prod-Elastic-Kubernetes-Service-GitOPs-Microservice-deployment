apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Theophilus18-cyber/Prod-Elastic-Kubernetes-Service-GitOPs-Microservice-deployment'
    targetRevision: staging
    path: k8s/external-secrets
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

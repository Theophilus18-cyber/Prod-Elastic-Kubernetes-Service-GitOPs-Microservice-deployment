apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

commonLabels:
  environment: dev

# Image tags will be updated by CI/CD
images:
- name: my-repo/orders-service
  newTag: dev-latest
- name: my-repo/payments-service
  newTag: dev-latest
- name: my-repo/delivery-service
  newTag: dev-latest
- name: my-repo/notifications-service
  newTag: dev-latest
- name: my-repo/frontend
  newTag: dev-latest

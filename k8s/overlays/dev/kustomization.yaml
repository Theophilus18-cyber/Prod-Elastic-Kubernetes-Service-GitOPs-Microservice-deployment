apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

commonLabels:
  environment: dev

# Image tags will be updated by CI/CD
images:
- name: my-repo/delivery-service
  newName: 381492025532.dkr.ecr.us-east-1.amazonaws.com/dev-delivery
  newTag: b68b98886c6c96de589e0c3ab411085c9457c247
- name: my-repo/frontend
  newName: 381492025532.dkr.ecr.us-east-1.amazonaws.com/dev-frontend
  newTag: b68b98886c6c96de589e0c3ab411085c9457c247
- name: my-repo/notifications-service
  newName: 381492025532.dkr.ecr.us-east-1.amazonaws.com/dev-notifications
  newTag: b68b98886c6c96de589e0c3ab411085c9457c247
- name: my-repo/orders-service
  newName: 381492025532.dkr.ecr.us-east-1.amazonaws.com/dev-orders
  newTag: b68b98886c6c96de589e0c3ab411085c9457c247
- name: my-repo/payments-service
  newName: 381492025532.dkr.ecr.us-east-1.amazonaws.com/dev-payments
  newTag: b68b98886c6c96de589e0c3ab411085c9457c247

patches:
  - target:
      kind: Deployment
      name: ".*-service"
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "b-1.devkafka.bikqyw.c6.kafka.us-east-1.amazonaws.com:9092,b-2.devkafka.bikqyw.c6.kafka.us-east-1.amazonaws.com:9092"
  - target:
      kind: Job
      name: kafka-setup
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "b-1.devkafka.bikqyw.c6.kafka.us-east-1.amazonaws.com:9092,b-2.devkafka.bikqyw.c6.kafka.us-east-1.amazonaws.com:9092"

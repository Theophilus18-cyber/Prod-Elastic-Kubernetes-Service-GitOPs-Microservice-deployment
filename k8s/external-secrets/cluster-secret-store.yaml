apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://10.0.1.115:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
          namespace: external-secrets
---
# Placeholder for the actual SecretStore credential
# In a real production setup with EKS, we would use IAM Roles for Service Accounts (IRSA) with Vault AWS Auth backend.
# However, given the current simple EC2 setup, we will use Token Auth as a starting point.
# The user will need to manually create the 'vault-token' secret in the 'external-secrets' namespace.

name: Staging Workflow

on:
  push:
    branches:
      - staging

permissions:
  id-token: write
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orders, payments, delivery, notifications]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push ${{ matrix.service }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: staging-${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd microservice-app/backend/${{ matrix.service }}-service
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: staging-frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd microservice-app/frontend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  update-manifests:
    runs-on: ubuntu-latest
    needs: [build-and-deploy, build-and-deploy-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update K8s Manifests
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          cd k8s/overlays/staging
          kustomize edit set image my-repo/orders-service=$ECR_REGISTRY/staging-orders:$SHA
          kustomize edit set image my-repo/payments-service=$ECR_REGISTRY/staging-payments:$SHA
          kustomize edit set image my-repo/delivery-service=$ECR_REGISTRY/staging-delivery:$SHA
          kustomize edit set image my-repo/notifications-service=$ECR_REGISTRY/staging-notifications:$SHA
          kustomize edit set image my-repo/frontend=$ECR_REGISTRY/staging-frontend:$SHA

      - name: Commit and Push
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git add k8s/overlays/staging/kustomization.yaml
          git commit -m "Update image tags to ${{ github.sha }}"
          git push origin staging
